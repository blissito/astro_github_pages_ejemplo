name: Auto-Generate README from CLAUDE.md

# Se ejecuta cuando:
# 1. Se hace push y CLAUDE.md fue modificado
# 2. Manualmente desde la pestaña Actions
on:
  push:
    paths:
      - 'CLAUDE.md'
  workflow_dispatch: # Permite ejecución manual

# Permisos necesarios para escribir al repositorio
permissions:
  contents: write
  
jobs:
  generate-readme:
    runs-on: ubuntu-latest
    
    steps:
      # 1. Checkout del código
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          # Necesario para hacer commits
          token: ${{ secrets.GITHUB_TOKEN }}
          
      # 2. Configurar Python
      - name: 🐍 Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      # 3. Instalar dependencias Python
      - name: 📦 Install Python dependencies
        run: |
          pip install markdown2 reportlab
          
      # 4. Instalar Claude Code CLI
      - name: 🤖 Install Claude Code CLI
        run: |
          npm install -g @anthropic-ai/claude-code
          
      # 5. Verificar y configurar API key de Anthropic
      - name: 🔑 Verify Anthropic API Key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "❌ ANTHROPIC_API_KEY no configurada"
            echo "🔧 Configúrala en Settings → Secrets → Actions"
            exit 1
          fi
          echo "✅ ANTHROPIC_API_KEY configurada: ${ANTHROPIC_API_KEY:0:10}..."
          
      # 5.1. Probar Claude CLI
      - name: 🧪 Test Claude CLI
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          echo "🔍 Probando conexión con Claude..."
          claude --version || echo "⚠️  Claude CLI instalado pero no puede verificar versión"
          echo "🧪 Test rápido con Claude:"
          echo "Hola Claude, responde solo 'OK'" | claude -p --model haiku || echo "⚠️  Test falló, pero continuamos..."
          
      # 6. Generar README y PDF
      - name: 📝 Generate README from CLAUDE.md
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          echo "🚀 Generando README desde CLAUDE.md..."
          python3 scripts/generate_readme_pdf.py
          
      # 7. Verificar que se generaron los archivos
      - name: 🔍 Check generated files
        run: |
          if [ -f README.md ]; then
            echo "✅ README.md generado exitosamente"
            echo "📄 Primeras 5 líneas del README:"
            head -5 README.md
          else
            echo "❌ README.md no se generó"
            exit 1
          fi
          
          if [ -f README.pdf ]; then
            echo "✅ README.pdf generado exitosamente"
            ls -lh README.pdf
          fi
          
      # 8. Configurar Git para commits automáticos
      - name: ⚙️ Configure Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action [README Generator]"
          
      # 9. Commit y push de los cambios
      - name: 📤 Commit and push changes
        run: |
          # Agregar archivos (con -f para README.pdf si está ignorado)
          git add README.md
          git add -f README.pdf 2>/dev/null || echo "⚠️  README.pdf no se pudo agregar (normal si no se generó)"
          
          # Verificar si hay cambios para commitear
          if git diff --quiet --cached; then
            echo "📋 No hay cambios para commitear"
          else
            echo "📝 Detectados cambios, haciendo commit..."
            git commit -m "🤖 Auto-update README.md and README.pdf from CLAUDE.md
            
            Generated by GitHub Action on $(date)
            Triggered by: ${{ github.event.head_commit.message }}"
            git push
            echo "✅ Cambios enviados al repositorio"
          fi
          
      # 10. Resumen del resultado
      - name: 📊 Action Summary
        run: |
          echo "## 🎉 README Generator - Completado" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📄 Archivos generados:" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ README.md (desde CLAUDE.md)" >> $GITHUB_STEP_SUMMARY
          if [ -f README.pdf ]; then
            echo "- ✅ README.pdf" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔗 Enlaces útiles:" >> $GITHUB_STEP_SUMMARY
          echo "- [Ver README.md](../README.md)" >> $GITHUB_STEP_SUMMARY
          echo "- [Ver CLAUDE.md](../CLAUDE.md)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "_Action ejecutada en: $(date)_" >> $GITHUB_STEP_SUMMARY