name: Simple Update Kids README

# Workflow simplificado que no requiere secrets adicionales
on:
  # Detectar cambios en archivos CLAUDE.md
  push:
    paths:
      - '**/CLAUDE.md'
      - '**/claude.md'
      - 'generate_kids_readme.py'
  
  # Permitir ejecución manual
  workflow_dispatch:

jobs:
  generate-readme:
    runs-on: ubuntu-latest
    
    steps:
      # Checkout del código
      - uses: actions/checkout@v4
      
      # Configurar Python
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      # Ejecutar script generador
      - name: Generate Kids README
        run: |
          echo "🚀 Generando README para niños..."
          python3 generate_kids_readme.py
      
      # Commit automático si hay cambios
      - uses: EndBug/add-and-commit@v9
        with:
          message: '🤖 Auto-update: README para niños actualizado'
          add: 'README_KIDS.md'
          default_author: github_actions
          # Esto evita loops infinitos
          push: true