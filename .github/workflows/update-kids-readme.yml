name: Update Kids README

# Cuándo ejecutar este workflow
on:
  # Ejecutar cuando hay cambios en archivos CLAUDE.md
  push:
    paths:
      - '**/CLAUDE.md'
      - '**/claude.md'
      - 'generate_kids_readme.py'
    branches:
      - main
      - master
  
  # Ejecutar diariamente a las 8:00 AM UTC (3:00 AM México)
  schedule:
    - cron: '0 8 * * *'
  
  # Permitir ejecución manual desde la pestaña Actions
  workflow_dispatch:
    inputs:
      debug_enabled:
        description: 'Run with debug logging'
        required: false
        default: 'false'

jobs:
  update-readme:
    runs-on: ubuntu-latest
    
    # Permisos necesarios para hacer push
    permissions:
      contents: write
      
    steps:
      # 1. Checkout del repositorio
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Importante: fetch completo para tener el historial
          fetch-depth: 0
          # Usar el token de GitHub para poder hacer push
          token: ${{ secrets.GITHUB_TOKEN }}
      
      # 2. Configurar Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      # 3. Instalar dependencias si las hay
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Si tu script necesita dependencias adicionales, agrégalas aquí
          # pip install -r requirements.txt
      
      # 4. Verificar archivos CLAUDE.md
      - name: List CLAUDE.md files
        run: |
          echo "📋 Buscando archivos CLAUDE.md en el repositorio..."
          find . -type f \( -iname "claude.md" \) -not -path "./node_modules/*" -not -path "./.git/*" | head -20
          echo ""
          echo "Total de archivos encontrados:"
          find . -type f \( -iname "claude.md" \) -not -path "./node_modules/*" -not -path "./.git/*" | wc -l
      
      # 5. Ejecutar el script generador
      - name: Generate Kids README
        env:
          # API key de Anthropic (configurada como secret en GitHub)
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          echo "🚀 Ejecutando script para generar README para niños..."
          python3 generate_kids_readme.py
          
          # Verificar que se generó el archivo
          if [ -f "README_KIDS.md" ]; then
            echo "✅ README_KIDS.md generado exitosamente"
            echo "📊 Tamaño del archivo: $(wc -c < README_KIDS.md) bytes"
            echo "📝 Primeras líneas del archivo:"
            head -n 10 README_KIDS.md
          else
            echo "❌ Error: No se generó README_KIDS.md"
            exit 1
          fi
      
      # 6. Verificar si hay cambios
      - name: Check for changes
        id: git-check
        run: |
          git diff --exit-code README_KIDS.md || echo "changes=true" >> $GITHUB_OUTPUT
          
          if [ "${{ steps.git-check.outputs.changes }}" == "true" ]; then
            echo "📝 Se detectaron cambios en README_KIDS.md"
          else
            echo "✨ No hay cambios en README_KIDS.md"
          fi
      
      # 7. Configurar Git
      - name: Configure Git
        if: steps.git-check.outputs.changes == 'true'
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
      
      # 8. Commit y Push de los cambios
      - name: Commit and Push changes
        if: steps.git-check.outputs.changes == 'true'
        run: |
          git add README_KIDS.md
          git commit -m "🤖 Auto-update: README para niños actualizado

          Este README fue generado automáticamente basándose en los archivos CLAUDE.md del proyecto.
          
          Trigger: ${{ github.event_name }}
          Commit: ${{ github.sha }}
          
          [skip ci]" || echo "No hay cambios para commitear"
          
          git push origin HEAD:${{ github.ref }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      # 9. Resumen de la ejecución
      - name: Summary
        if: always()
        run: |
          echo "## 📊 Resumen de la Actualización del README para Niños" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -f "README_KIDS.md" ]; then
            echo "✅ **Estado:** README generado exitosamente" >> $GITHUB_STEP_SUMMARY
            echo "📏 **Tamaño:** $(wc -c < README_KIDS.md) bytes" >> $GITHUB_STEP_SUMMARY
            echo "📝 **Líneas:** $(wc -l < README_KIDS.md)" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Estado:** Error al generar README" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📁 Archivos CLAUDE.md procesados:" >> $GITHUB_STEP_SUMMARY
          find . -type f \( -iname "claude.md" \) -not -path "./node_modules/*" -not -path "./.git/*" | head -10 >> $GITHUB_STEP_SUMMARY
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔄 **Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "🏷️ **Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "💼 **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
      
      # 10. Notificación de error (opcional)
      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ El workflow falló. Revisa los logs para más detalles."
          # Aquí podrías agregar notificaciones por Slack, Discord, email, etc.